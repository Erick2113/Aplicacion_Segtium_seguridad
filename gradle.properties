# Project-wide Gradle settings.
# Specifies the JVM arguments used for the daemon process.
# Reduced memory and switched to SerialGC to handle low memory conditions.
org.gradle.jvmargs=-Xmx1024m -XX:+UseSerialGC -Dfile.encoding=UTF-8

# Force Kotlin to compile within the Gradle process to save memory and avoid daemon connection issues.
kotlin.compiler.execution.strategy=in-process

# Disable parallel execution and limit workers to minimize memory footprint.
org.gradle.parallel=false
org.gradle.workers.max=1

# AndroidX and other standard settings
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
